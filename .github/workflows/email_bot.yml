name: Bulk Email Automation

on:
  workflow_dispatch:  # Manual trigger ke liye (jab bhi khud chalana ho)
  schedule:
    - cron: '0 0 * * *'  # Har rooz UTC 00:00 (Pakistan time 5:00 AM PKT) par auto-run

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Email Automation Script
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python send_emails.py
